services:
  # Remote Write Service
  remote-write:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cb-remote-write
    ports:
      - "8080:8080"
    environment:
      # Couchbase connection
      - COUCHBASE_CONNECTION_STRING=couchbase://localhost
      - COUCHBASE_USERNAME=Administrator
      - COUCHBASE_PASSWORD=password
      - COUCHBASE_BUCKET=cbmonitor
      - COUCHBASE_SCOPE=_default
      - COUCHBASE_COLLECTION=_default

      # Storage settings
      - STORAGE_BATCH_SIZE=100
      - STORAGE_FLUSH_INTERVAL=2s
      - STORAGE_TIMESERIES_INTERVAL=1h
      - STORAGE_RETENTION_PERIOD=24h

      # Server settings
      - SERVER_LISTEN_ADDRESS=:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://remote-write:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 3
    networks:
      - perf-network
  # vmagent for local testing
  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: vmagent
    ports:
      - "8429:8429"
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://remote-write:8080/api/v1/write"
      - "-httpListenAddr=:8429"
    volumes:
      - ./vmagent-config.yml:/etc/vmagent/scrape.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://vmagent:8429/health"]
      interval: 60s
      timeout: 15s
      retries: 3
    networks:
      - perf-network

  # For my local testing. Check if you have this network in your local machine.
networks:
  perf-network:
    name: local-perf-testing
    external: true
