server:
  listen_address: ":8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  max_request_size: 33554432  # 32MB
  enable_profiling: false
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

couchbase:
  connection_string: "couchbase://localhost"
  username: ""
  password: ""
  bucket: "metrics"
  scope: "_default"
  collection: "_default"
  connect_timeout: "10s"
  kv_timeout: "5s"

storage:
  batch_size: 1000
  flush_interval: "5s"
  document_size_limit: 20971520  # 20MB
  timeseries_interval: "1h"      # Group samples by hour
  retention_period: "720h"        # 30 days
  compression_enabled: true
  timeseries_type: "irregular"   # "regular" or "irregular"
  regular_sample_interval: "1m"   # Only when timeseries_type=regular

metrics:
  enabled: true
  path: "/metrics"
